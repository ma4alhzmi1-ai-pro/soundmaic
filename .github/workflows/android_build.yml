name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check release signing secrets
      id: signing
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Release APK skipped: configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in repository Actions secrets."
        fi

    - name: Restore release keystore
      if: steps.signing.outputs.configured == 'true'
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
        chmod 600 "$RUNNER_TEMP/my-upload-key.jks"
        keytool -list -keystore "$RUNNER_TEMP/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias upload >/dev/null

    - name: Run Unit Tests and Robolectric Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build signed Release APK
      if: steps.signing.outputs.configured == 'true'
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Soundmaic-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload signed Release APK Artifact
      if: steps.signing.outputs.configured == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Soundmaic-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
